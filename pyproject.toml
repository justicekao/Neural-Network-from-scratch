# NEEDS YOUR INPUT: change "authors" and the GitHub URL under
# [project.urls] before you publish. Everything else can stay as-is.

[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genmonod"
version = "0.1.0"
description = "Generalized multi-strain Monod kinetics fitter with a visual matrix editor and a fit-history-based initial-guess model"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "you@example.com" }
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "streamlit>=1.30",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
# NEEDS YOUR INPUT: nothing. This is what makes `genmonod-app` work as a
# command after `pip install -e .` — it points to cli.py's main().
genmonod-app = "genmonod.cli:main"

[project.urls]
Repository = "https://github.com/<your-username>/genmonod"

[tool.setuptools.packages.find]
where = ["src"]
