# NEEDS YOUR INPUT: change "name", "authors", and the GitHub URL under
# [project.urls] before you publish. Everything else can stay as-is.
#
# This file is what makes the project "pip installable" — it tells Python
# packaging tools your package's name, dependencies, and where the source
# code lives (the src/ layout below).

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "monod-pinn"
version = "0.1.0"
description = "Physics-informed CNN for fitting Monod growth-kinetics parameters from strain population time series"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "you@example.com" }
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "tqdm>=4.64",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Repository = "https://github.com/<your-username>/monod-pinn"

# This tells setuptools the actual package code is under src/monod_pinn
[tool.setuptools.packages.find]
where = ["src"]
